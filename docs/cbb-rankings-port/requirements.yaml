# Contract: durable task-definition handoff created by $work when the selected mode needs explicit requirements

artifact: requirements
feature: "cbb-rankings-port"
mode: "large-initiative"
status: draft
owner_skill: work

summary:
  problem: >
    cbb-rankings is an empty repository. The owner wants NCAA Division I men's basketball rankings
    produced by the same convex quadratic program that cfb-rankings uses for football, shown on
    personal-site in the existing design system.
  motivation: >
    The Entrekin Quadratic Index is presented on the site as "One Model, Two Sports"; the basketball
    half is a "Check Back Soon" stub and the methodology write-up is football-only.
  requested_outcome: >
    A scoped, batched, multi-PR plan covering data ingestion, data storage, basketball-specific
    modeling changes, the CBB page on the site, and generalizing the methodology write-up.

goals:
  - "Ingest D-I men's basketball games and teams into a database owned by cbb-rankings."
  - "Store games, teams and ratings in Cloudflare D1 with schema DDL checked into the repository."
  - "Run the same optimization formulation as cfb-rankings, with hyperparameters in configuration and football values as the starting defaults."
  - "Publish weekly rankings JSON to R2 in the shape personal-site already consumes for football."
  - "Replace the CBB stub page with a live rankings table built on components shared with the CFB page."
  - "Generalize the Entrekin Quadratic Index methodology write-up so it covers both sports."

non_goals:
  - "A basketball equivalent of the football Season Grid, standings, tiebreakers or bracket (owner: not yet)."
  - "Backtesting or retuning hyperparameters for basketball (owner: keep football constants for now)."
  - "Extracting a shared Python package used by both sports repositories (possible later PR)."
  - "Women's basketball."
  - "Any change to cfb-rankings code, schema, or its Supabase database."
  - "Charts or other new data visuals on the site."

constraints:
  technical:
    - "Objective terms, constraints and variable structure of model/model.py in cfb-rankings must be preserved; only constants and sport labels may differ, and they must be configuration."
    - "Storage is Cloudflare D1 (SQLite dialect): at most 100 bound parameters per statement, 100 KB per statement, no materialized views, no array or timestamptz types."
    - "Pipeline runs as a Python batch job in GitHub Actions and reaches D1 from outside Workers (REST API or wrangler)."
    - "personal-site stays fully static: it reads JSON from R2 at build time; it does not query D1."
    - "Both sports must not collide on R2 keys (football hard-codes rankings/ and schedule/ prefixes)."
    - "CBBD and CFBD share one monthly API call quota (about 1,000 calls on the free tier)."
    - "personal-site: tokens only, no hard-coded hex, server/client render parity rule, 390px no-horizontal-scroll budget, ClientRouter lifecycle (DESIGN.md)."
    - "Any new logo host must be added to img-src in personal-site public/_headers."
  product:
    - "Non-D-I opponents mirror football's FCS handling: one shared dummy team with a low rating ceiling; only D-I losses to non-D-I teams enter the optimization; wins count in the record only."
    - "Weekly cadence: one run and one browsable snapshot per week, like football."
    - "Rated games: regular season plus conference tournaments. NCAA tournament and other national postseason events are not rated; rankings freeze at Selection Sunday."
    - "Hyperparameters launch with football values."
    - "Site: shared rankings pieces are extracted from the CFB page first, with the CFB page's rendered output unchanged; the CBB page shows the rankings table only."
  process:
    - "One PR per batch; agents never merge; no PR is opened without the owner's go-ahead."
    - "All work on branch claude/sleepy-tesla-rnjsvt in each repository unless the owner directs otherwise."
    - "Secrets are created by the owner; names only appear in the repository."

assumptions:
  - "Data source is CollegeBasketballData (api.collegebasketballdata.com, cbbd client), subject to the non-D-I probe in task B2-T1. Fallback is ESPN-derived data."
  - "Men's basketball only."
  - "Season is keyed by a single integer, following the source's season field (expected: the year the season ends)."
  - "Basketball week N is a 7-day bucket counted from the Monday on or before the season's first game day; the run happens Monday morning (UTC) and covers games through Sunday."
  - "The prior-fade schedule keeps football's formula and week-7 cutoff, applied to basketball week numbers."
  - "R2: same bucket as football with a cbb/ key prefix (cbb/rankings/...), unless the owner prefers a separate bucket."
  - "The site rebuild is triggered by the same Cloudflare Pages deploy hook the football workflow calls."
  - "The EQI methodology becomes one shared formulation with a per-sport parameter table and sport-neutral wording for the lower-division term."

