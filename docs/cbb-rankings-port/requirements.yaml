research:
  repo_findings:
    - "The QP is one CVXPY problem: margin term gamma_margin*pos(r_loser + min(k*sqrt(margin),20)*alpha - r_winner)^2 with k = 7/sqrt(median margin); loss-rate term gamma_loss*(r*loss_rate)^2; lower-division loss term gamma_fcs*pos(r + margin*alpha - r_fcs)^2; prior term lambda*sum((r - prior)^2); bounds 0.01..100 and 0.01..15 for the dummy team."
    - "Constants: gamma_margin 0.05, gamma_loss 0.5, gamma_fcs 5, lambda = (7 - week)/700 below week 7 else 0, alpha 1.0 neutral / 0.8 home win / 1.2 away win, default prior 1. No tuning record. Solver is CVXPY's default (unnamed)."
    - "prior_model.py re-solves last season's full problem on every run and duplicates about 100 lines of model.py."
    - "Football's model has no tests and CI never runs the test suite; pytest is not a declared dependency."
    - "Base DDL for games, teams and ratings is absent from cfb-rankings; only later migrations exist."
    - "Football rankings artifact: {season, week, generated_at_utc, rankings:[{rank, team, conference, logo, record, rating, delta}]} plus rankings/index.json {generated_at_utc, latest_season, latest_week, seasons:[{season, weeks}]}."
    - "personal-site fetches every snapshot at build time over the S3 API into public/data/cfb (gitignored), server-renders the latest, and re-fetches same-origin on selector change."
    - "The CFB page keeps toolbar, tabs, selectors and about 1,050 lines of client script inline; conference lists and week handling are football-specific; RankingsTable and RankingsHeader are already sport-agnostic."
    - "The methodology write-up is on the EQI page, not the index page; football-specific parts are the FCS set and dummy team, 'FBS teams', the Week 7 prior fade, the 'FCS Losses Hurt' point and the 'Why I Built It' story."
    - "personal-site has no test runner, lint config or CI; verification is astro check plus the manual checklist in DESIGN.md."
  platform_findings:
    - "CBBD GameInfo carries id, season, season_type, start_date, neutral_site, conference_game, tournament, status, home/away team_id, team, conference, points, period_points, winner; TeamInfo carries a stable id, colors and logos; /conferences/history gives membership by season. cbbd 1.30.3 released 2026-11-03."
    - "No division or classification field is visible on CBBD game or team objects; how non-D-I opponents appear is unverified (primary docs were unreachable from this session)."
    - "CBBD /games returns at most 3,000 games per call; a D-I season is about 6,000 games, so pulls must be by date range."
    - "D1 free tier: 5 million rows read and 100,000 rows written per day, 500 MB per database; the expected data is tens of MB at most. Limits come from search summaries, not a page read directly."
    - "Unverified for D1: API token scoping to a single database, REST /query batch behavior, wrangler d1 migrations behavior, the free-plan Time Travel window, and any idle-database policy."
    - "NET excludes non-D-I games (secondary sources); the owner chose to mirror football instead."

acceptance_criteria:
  - "A reviewer can run the ported model with football configuration on a fixed fixture and get the same ratings as cfb-rankings/model/model.py within solver tolerance."
  - "A fresh D1 database can be built from the migrations in the repository alone."
  - "A backfill of at least the current and previous season completes within D1 and CBBD free-tier limits."
  - "The weekly workflow publishes cbb/rankings/index.json and a week file that validate against the documented shape, and fails loudly on ingest failure rather than publishing stale rankings."
  - "After the site refactor PR, the CFB page's built HTML is unchanged apart from attribute ordering and hashed asset names."
  - "The CBB page renders about 365 teams from R2 data, passes astro check, and meets the DESIGN.md checklist (JS-off parity, 390px budget)."
  - "The EQI page describes both sports without football-only terms in the shared formulation."

open_questions:
  - "Does CBBD include games against non-D-I opponents, and how can a non-D-I team be identified? (Resolved by task B2-T1; needs network access to api.collegebasketballdata.com or an Actions run.)"
  - "Same R2 bucket with a cbb/ prefix, or a separate bucket?"
  - "Is the shared CFBD/CBBD free quota enough alongside the football job, or will a paid tier be used?"
  - "Should the rankings table get a team search and conference filter in this effort? (365 rows; not requested.)"
  - "Does the 'Why I Built It' story on the EQI page stay football-framed?"

ready_for_planning: true
planning_blockers: []
