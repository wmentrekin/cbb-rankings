# Contract: durable execution plan created by $work when the selected mode needs explicit planning

artifact: plan
feature: "cbb-rankings-port"
mode: "large-initiative"
status: draft
owner_skill: work
based_on: "docs/cbb-rankings-port/requirements.yaml"

objective: >
  Deliver D-I men's basketball rankings from the cfb-rankings optimization: CBBD ingestion into
  Cloudflare D1, the ported and parametrized model, weekly R2 artifacts, a live CBB page on
  personal-site built on components shared with the CFB page, and a sport-neutral methodology
  write-up. Seven batches, one PR each, after an owner setup gate.

approach:
  summary: >
    A source probe runs first because it decides the schema. cbb-rankings is then built bottom-up
    (storage, ingestion, model, orchestration), one PR per batch. The site refactor (B5) has no
    dependency on the pipeline and can run alongside B1-B4. The CBB page (B6) is developed against
    a fixture that follows the artifact contract and merged only after B4 has published real data.
    The methodology rewrite (B7) comes last.
  key_decisions:
    - "Storage: Cloudflare D1; schema applied with wrangler d1 migrations; Python reaches it through one thin client module. REST query versus wrangler-applied SQL files is settled by B1-T2."
    - "Source: CollegeBasketballData, gated by the probe B1-T1. Fallback is ESPN-derived data."
    - "teams holds D-I teams only, per season. An opponent whose id is not in teams for that season is non-D-I and maps to the shared dummy team."
    - "Team id is the key everywhere (ratings, games winner, model variables); names are display only. This removes football's name-collision with the dummy team."
    - "Model: copied from cfb-rankings and parametrized with ModelConfig; football values are the defaults; the prior-season solve is the same function with the prior term off and football's guarded, raising behavior; the caller runs the prior solve and passes priors in. The dummy team's rating is never returned or stored."
    - "Football behaviors kept exactly: median margin and k computed over D-I vs D-I games only (fallback 1.0 with no games, sqrt floor 1e-6); the cap applies only to the D-I term; the lower-division term uses raw margin times alpha; records include games against non-D-I opponents."
    - "Changed on purpose and recorded: unplayed games are detected from source status, not a 0-0 score; ties are dropped; the connectivity index is kept as a logged diagnostic only."
    - "Parity is proven against a frozen reference: a vendored copy of the football objective and derivations under tests/reference/ (provenance cfb-rankings @ 8ab8201, cvxpy version, solver), changed only to take in-memory inputs, plus golden outputs generated once from the real football code. No cross-repository import."
    - "Cadence: weekly, Monday 10:00 UTC. Week N is a Monday-Sunday bucket of US/Eastern game dates counted from a stored per-season anchor. The Monday run publishes the week that ended the day before. Every week through the one containing Selection Sunday gets a snapshot; nothing after."
    - "Rated games are flagged at ingest (is_rated): regular season, including in-season events, plus conference tournaments. The flag's rules come from the probe's reading of season_type and tournament."
    - "Week resolution is one function, written in B2 and imported by B4."
    - "Artifacts keep football's JSON shapes under a cbb/ key prefix; staging runs write under cbb-staging/. The conference display string and logo URL are resolved in the pipeline at artifact build."
    - "Site: a per-sport config (data path, R2 prefix, week label, season label formatter, conference names, enabled views) drives shared rankings components. Fetching CBB data is switched on in B6, not B5, so production builds cannot fail on missing cbb/ data."

contracts:
  interfaces:
    - "storage client: query(sql, params) -> rows; execute_many(sql, rows) chunked under D1's 100-bound-parameter and 100 KB statement limits"
    - "assemble(games, d1_team_ids) -> (rated_pairs, lower_division_losses, records, connectivity)"
    - "solve(rated_pairs, lower_division_losses, records, priors | None, week, config) -> {team_id: rating}; raises on infeasible; no database access; priors None means the prior-season solve"
    - "ModelConfig: r_min, r_max, r_lower_min, r_lower_max, gamma_margin, gamma_loss, gamma_lower, target_gap_for_median, max_gap_from_margin, median_fallback, sqrt_floor, prior_fade_weeks, prior_fade_scale, alpha_neutral, alpha_home_win, alpha_away_win, default_prior, solver"
    - "resolve_week(season, today) -> week | None, from the seasons table"
    - "R2 keys: cbb/rankings/{season}/week-{WW}.json, cbb/rankings/{season}/latest.json, cbb/rankings/latest.json, cbb/rankings/index.json"
    - "Week file: {season, week, generated_at_utc, rankings:[{rank, team, conference, logo, record, rating, delta}]}; record is W-L"
    - "Index file: {generated_at_utc, latest_season, latest_week, seasons:[{season, weeks:[int]}]}"
    - "site sport config: {slug, dataDir, r2Prefix, weekLabel, seasonLabel(season), conferenceShortNames, views}"
  schemas:
    - "PROVISIONAL until B1-T1 reports."
    - "seasons(season PRIMARY KEY, anchor_monday, selection_sunday, last_ingested_at)"
    - "teams(id, season, school, abbreviation, conference, primary_color, secondary_color, logo, PRIMARY KEY (id, season)); D-I only"
    - "games(id PRIMARY KEY, season, week, game_date TEXT (US/Eastern), start_date TEXT ISO UTC, season_type, tournament, is_rated, status, home_team_id, home_team, home_score, away_team_id, away_team, away_score, neutral_site, conference_game, periods, margin, winner_team_id, alpha)"
    - "ratings(team_id, season, week, rating, wins, losses, PRIMARY KEY (team_id, season, week)); ratings_staging with the same columns"
  config_changes:
    - "cbb-rankings secrets (names only): CBBD_API_KEY, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_D1_DATABASE_ID, CLOUDFLARE_API_TOKEN, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME, PERSONAL_SITE_DEPLOY_HOOK_URL"
    - "personal-site: public/_headers img-src gains the basketball logo host; .gitignore gains public/data/cbb/"

branching:
  strategy: "single-branch"
  branch_name: "claude/sleepy-tesla-rnjsvt"
  worktrees: []

owner_gates:
  - id: "G0"
    before: "B1"
    items:
      - "Decide: same R2 bucket with a cbb/ prefix, or a separate bucket."
      - "CBBD API key available to the probe, and api.collegebasketballdata.com allowed in this session's network (or the probe runs as a manual Actions workflow)."
  - id: "G1"
    before: "B1 validation against real D1, and B2 backfill"
    items:
      - "Create the D1 database and an API token; add the Cloudflare and CBBD secrets to the cbb-rankings repository."
      - "Decide whether to stay on the free CBBD quota shared with football."
  - id: "G2"
    before: "B4 staging run and first publish"
    items:
      - "Add R2 and deploy-hook secrets to cbb-rankings."
      - "Approve the launch backfill: game data for the previous and current season, then ratings for weeks 1..N of the current season."

execution_batches:
  - id: "B1"
    goal: "cbb-rankings PR 1: source probe, scaffold and D1 storage"
    tasks:
      - id: "B1-T1"
        title: "Probe CBBD"
        objective: "From one season of games and teams, establish: whether non-D-I opponents appear and how to identify them; season keying; season_type and tournament values and how conference tournaments, in-season events, NCAA and NIT are distinguished; how unplayed and cancelled games are marked; logo variants and host; team id stability; calls needed per season. Stop and report if non-D-I games are absent."
        assigned_domain: "data-engineer"
        model_routing: {task_profile: "research", uncertainty: "high", consequence: "high", scope_size: "narrow", determinism: "interpretive", requested_tier: "frontier", requested_reasoning: "high", provider_model: "Claude Opus", routing_enforced: false, escalation_tier: "frontier", escalation_condition: "none above frontier; unresolved findings go to the owner"}
        owned_scope: ["cbb-rankings/docs/source-probe.md"]
        forbidden_scope: ["cfb-rankings/**", "personal-site/**"]
        dependencies: ["G0"]
        parallelizable: true
        expected_validation: ["written findings with sample rows and counts per season_type and tournament value"]
      - id: "B1-T2"
        title: "Verify D1 access facts"
        objective: "From Cloudflare's documentation: REST query endpoint, batch and rate limits, statements needed for a 6,000-game season at 100 bound parameters, wrangler d1 migrations and execute --file, token scoping, backup window. Recommend the write path."
        assigned_domain: "platform-engineer"
        model_routing: {task_profile: "research", uncertainty: "medium", consequence: "medium", scope_size: "narrow", determinism: "interpretive", requested_tier: "balanced", requested_reasoning: "medium", provider_model: "Claude Sonnet", routing_enforced: false, escalation_tier: "frontier", escalation_condition: "cannot reconcile conflicting documentation without guessing"}
        owned_scope: []
        forbidden_scope: ["cfb-rankings/**", "personal-site/**"]
        dependencies: []
        parallelizable: true
        expected_validation: ["facts cited with URLs"]
      - id: "B1-T3"
        title: "Scaffold, schema and storage client"
        objective: "pyproject with uv, Python 3.12 and pytest as a dev dependency; wrangler config; migrations for seasons, teams, games, ratings and ratings_staging; the storage client; a migration-apply workflow; a CI workflow that runs the tests; .env.example; README and AGENTS.md."
        assigned_domain: "data-engineer"
        model_routing: {task_profile: "implementation", uncertainty: "medium", consequence: "medium", scope_size: "bounded", determinism: "interpretive", requested_tier: "balanced", requested_reasoning: "medium", provider_model: "Claude Sonnet", routing_enforced: false, escalation_tier: "frontier", escalation_condition: "cannot design the chunked write path within D1 limits without guessing"}
        owned_scope: ["cbb-rankings/pyproject.toml", "cbb-rankings/uv.lock", "cbb-rankings/.python-version", "cbb-rankings/.env.example", "cbb-rankings/wrangler.toml", "cbb-rankings/database/**", "cbb-rankings/tests/**", "cbb-rankings/.github/workflows/tests.yml", "cbb-rankings/.github/workflows/apply-migrations.yml", "cbb-rankings/README.md", "cbb-rankings/AGENTS.md"]
        forbidden_scope: ["cbb-rankings/.agents/**", "cfb-rankings/**", "personal-site/**"]
        dependencies: ["B1-T1", "B1-T2"]
        parallelizable: false
        expected_validation: ["migrations apply to a local D1/SQLite database", "storage client tests against a fake transport, including chunk sizing", "pytest runs in CI"]
  - id: "B2"
    goal: "cbb-rankings PR 2: ingestion"
    tasks:
      - id: "B2-T1"
        title: "Fetch, classify, derive, assign weeks"
        objective: "Retrying HTTP session; D-I teams and conference membership per season; games by date range; status-based played rule; winner, margin and alpha derivations; is_rated; US/Eastern game_date; the seasons table and resolve_week."
        assigned_domain: "data-engineer"
        model_routing: {task_profile: "implementation", uncertainty: "medium", consequence: "medium", scope_size: "bounded", determinism: "interpretive", requested_tier: "balanced", requested_reasoning: "medium", provider_model: "Claude Sonnet", routing_enforced: false, escalation_tier: "frontier", escalation_condition: "cannot make week or is_rated rules consistent with probe samples"}
        owned_scope: ["cbb-rankings/ingest/**", "cbb-rankings/database/migrations/**", "cbb-rankings/tests/**", "cbb-rankings/pyproject.toml", "cbb-rankings/uv.lock", "cbb-rankings/README.md", "cbb-rankings/AGENTS.md"]
        forbidden_scope: ["cbb-rankings/.agents/**", "cfb-rankings/**", "personal-site/**"]
