        model_routing: {task_profile: "implementation", uncertainty: "low", consequence: "medium", scope_size: "bounded", determinism: "interpretive", requested_tier: "balanced", requested_reasoning: "medium", provider_model: "Claude Sonnet", routing_enforced: false, escalation_tier: "frontier", escalation_condition: "repeated failure to reproduce football override semantics"}
        owned_scope: ["cbb-rankings/ingest/**", "cbb-rankings/scripts/**", "cbb-rankings/tests/**", "cbb-rankings/.github/workflows/backfill-games.yml"]
        forbidden_scope: ["cbb-rankings/.agents/**", "cfb-rankings/**", "personal-site/**"]
