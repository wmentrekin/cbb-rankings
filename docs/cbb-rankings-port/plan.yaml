        forbidden_scope: ["personal-site/.agents/**", "cbb-rankings/**", "cfb-rankings/**"]
        dependencies: ["B3-T2"]
        parallelizable: false
        expected_validation: ["equations render at build", "constants check script passes", "astro check", "390px equation overflow check"]

ordering_notes:
  - "G0 -> B1 -> B2 -> B4, with B3 after B1 and before B4."
  - "B5 is independent of B1-B4 and can start immediately; B1-T1, B1-T2 and B5-T1 may run in parallel."
  - "B6 follows B5 and the probe; merged once B4 has published real data."
  - "B7 follows B3."
  - "Tasks within a batch are sequential on the shared branch, so overlapping owned scopes between consecutive tasks are intended."
  - "Each batch stops at its own PR and review before a dependent batch starts."

risks:
  - "CBBD may omit non-D-I games or give no way to identify them; B1-T1 is the gate and ESPN-derived data is the fallback."
  - "Football constants on basketball data: the prior fades out after week 6 of about 19; the margin cap and the home/away multipliers were chosen for football; week 1 has few games per team. Accepted by the owner for launch."
  - "Problem size grows from about 130 teams and 800 games to about 365 teams and 6,000 games, and the prior solve repeats every run; measured in B3-T2."
  - "D1 write volume: about 5 game rows per statement at 100 bound parameters; path chosen in B1-T2."
  - "The CFBD/CBBD quota is shared; a backfill could starve the football job. Weekly and backfill call counts are reported before G2."
  - "The site refactor touches the live football page and the site has no automated tests; parity rests on HTML diff and the manual checklist."
  - "JSON shapes are hand-mirrored across repositories; the fixture and artifact tests both follow the contract here."
  - "Golden football outputs cannot be regenerated later without cfb-rankings @ 8ab8201 and the recorded cvxpy version."

model_routing_notes:
  - "Frontier only for the probe (uncertainty and consequence both high); balanced elsewhere per model-routing.md, with one tier increase available on evidence."
  - "Domain outcomes (source unusable, copy decisions, D1 limits forcing a redesign) go to the owner, not to a higher tier."
  - "Model selection is by name at spawn; reasoning level is not independently controllable."

open_questions:
  - "G0: same R2 bucket with a cbb/ prefix, or a separate bucket?"
  - "G0: how the probe reaches the CBBD API (allow the host in this environment, or a manual Actions run)."
  - "G1: free shared CBBD quota or a paid tier?"
  - "B7: does 'Why I Built It' stay football-framed?"

review:
  status: revised
  loop_count: 1
  notes:
    - "Reviewer-1 returned REVISE: model contract gaps, parity test design, schema keys and seasons table, week and timezone rules, probe ordering, owner gates, task sizing and scopes, routing tiers. All incorporated in this revision."

checkpoint:
  required_before_execution: true
  status: pending
