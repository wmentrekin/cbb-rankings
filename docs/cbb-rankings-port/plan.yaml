        owned_scope: ["cbb-rankings/main.py", "cbb-rankings/database/**", "cbb-rankings/tests/**", "cbb-rankings/pyproject.toml", "cbb-rankings/uv.lock"]
        forbidden_scope: ["cbb-rankings/.agents/**", "cbb-rankings/model/**", "cfb-rankings/**", "personal-site/**"]
        dependencies: ["B2-T2", "B3-T2"]
        parallelizable: false
        expected_validation: ["run tests with a fake storage transport", "ingest failure stops before the model"]
      - id: "B4-T2"
        title: "R2 artifacts and workflows"
        objective: "Rankings week, latest and index artifacts under cbb/ (cbb-staging/ in staging); conference display and logo resolution; weekly workflow with marker check and deploy hook; staging workflow; docs."
        assigned_domain: "data-engineer"
        model_routing: {task_profile: "implementation", uncertainty: "low", consequence: "medium", scope_size: "bounded", determinism: "interpretive", requested_tier: "balanced", requested_reasoning: "medium", provider_model: "Claude Sonnet", routing_enforced: false, escalation_tier: "frontier", escalation_condition: "artifact contract cannot be met from stored data"}
        owned_scope: ["cbb-rankings/artifacts/**", "cbb-rankings/tests/**", "cbb-rankings/.github/workflows/weekly-update.yml", "cbb-rankings/.github/workflows/test-week-run.yml", "cbb-rankings/README.md", "cbb-rankings/AGENTS.md", "cbb-rankings/pyproject.toml", "cbb-rankings/uv.lock"]
        forbidden_scope: ["cbb-rankings/.agents/**", "cbb-rankings/model/**", "cfb-rankings/**", "personal-site/**"]
        dependencies: ["B4-T1", "G2"]
        parallelizable: false
        expected_validation: ["artifact shape tests", "a staging run for one past week end to end", "workflow fails when the ingest marker is present"]
