        assigned_domain: "data-scientist"
        model_routing: {task_profile: "implementation", uncertainty: "medium", consequence: "high", scope_size: "bounded", determinism: "interpretive", requested_tier: "balanced", requested_reasoning: "medium", provider_model: "Claude Sonnet", routing_enforced: false, escalation_tier: "frontier", escalation_condition: "parity not reached and the differing term cannot be explained"}
        owned_scope: ["cbb-rankings/model/**", "cbb-rankings/tests/**", "cbb-rankings/README.md", "cbb-rankings/AGENTS.md"]
        forbidden_scope: ["cbb-rankings/.agents/**", "cbb-rankings/tests/reference/**", "cfb-rankings/**", "personal-site/**"]
        dependencies: ["B3-T1"]
        parallelizable: false
        expected_validation: ["end-to-end parity from the raw fixture within the requirements' tolerance: objective, four term values, ratings", "defaults pinned to football constants", "dummy team absent from output", "infeasible problem raises", "solve time reported"]
