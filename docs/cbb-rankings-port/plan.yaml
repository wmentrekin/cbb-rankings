        owned_scope: ["personal-site/src/pages/projects/cfb-rankings/**", "personal-site/src/components/**", "personal-site/src/lib/**", "personal-site/DESIGN.md"]
        forbidden_scope: ["personal-site/.agents/**", "personal-site/src/pages/projects/cbb-rankings.astro", "cbb-rankings/**", "cfb-rankings/**"]
