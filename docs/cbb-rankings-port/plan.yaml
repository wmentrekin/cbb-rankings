        assigned_domain: "frontend-engineer"
        model_routing: {task_profile: "implementation", uncertainty: "low", consequence: "medium", scope_size: "narrow", determinism: "interpretive", requested_tier: "balanced", requested_reasoning: "medium", provider_model: "Claude Sonnet", routing_enforced: false, escalation_tier: "frontier", escalation_condition: "equations cannot be restated without changing their meaning"}
