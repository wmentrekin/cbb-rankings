  - "Owner: storage is Cloudflare D1."
  - "Owner: non-D-I opponents mirror football's FCS dummy-team handling."
  - "Owner: weekly run only."
  - "Owner: copy and parametrize the model; no shared package yet."
  - "Owner: rate games through conference tournaments; NCAA tournament not rated."
  - "Owner: extract shared site components from the CFB page first."
  - "Owner: no need to recreate the Season Grid yet; CBB page is the rankings table only."
  - "Owner: keep football constants at launch."
  - "Owner (G0): same R2 bucket as football, cbb/ prefix."
  - "Owner (G0): will allow api.collegebasketballdata.com in this environment for the probe."
  - "Owner: confirmed trusting the source on non-D-I games (overrides available) and week 1 starting on the opening Monday with earlier games folded in."
  - "Owner: Clarabel is the named solver; the parity run uses OSQP."
  - "Owner: asked for the football margin-scale bug to be fixed; basketball therefore uses the documented formula (true median margin). The owner is doing the football fix in a separate session; the agent started here was stopped with no changes to cfb-rankings."
  - "Orchestrator: weekly run always does a full-season ingest (4 API calls); reported to the owner."
  - "Owner: undetermined ratings (unbeaten teams once the prior has faded) are published at the lowest optimal value; football-compatible mode keeps the solver's value."
  - "Owner (2026-11-24): stay as close to cfb-rankings as possible: football's solver (OSQP) and solver-chosen undetermined ratings; adopt football's no-floor model and display shift; prior fades at week 10; target gap is half the median margin (5.0); cap stays 20. Asked for PRs."
  - "Owner (G1): provided a D1 Edit token (stored on the environment, proxy-injected) and asked the orchestrator to create the database; cbb-rankings D1 database created, id 4670facc-438e-40ce-9841-b4626c6ca3f0. Stay on the free CBBD quota."

