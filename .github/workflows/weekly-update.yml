name: Weekly Rankings

# Every Monday 10:00 UTC (05:00-06:00 US/Eastern, after the weekend's games are final): ingest the
# season, apply overrides, rate the week that ended yesterday, write `ratings`, publish the JSON to
# R2 under cbb/, then trigger the personal-site rebuild. See main.py.
#
# The cron fires all year. Out-of-season Mondays are no-ops: main.py prints `WEEKLY_NOOP: ...`,
# exits 0, spends no API call, and the deploy hook is NOT called.
#
# Shared concurrency group (see below): the scheduled run must never overlap a manual D1 writer, but
# GitHub keeps only ONE pending run per group and a newer pending run cancels an older pending one.
# So a Monday run queued behind a long manual backfill is replaced if someone dispatches another
# workflow of this group meanwhile; the manual workflows print a reminder at start. There is no
# simple, correct alternative (separate groups would allow two writers; a second cron would only
# repeat the ingest and the site rebuild), so this is a documented limitation: do not dispatch
# while the Monday run is queued, and if a Monday run shows as cancelled, rerun it. A skipped week
# also heals itself: the next run rates and publishes every earlier week without ratings (catch-up).
#
# Errors are never masked: main.py's exit code fails the job (INGEST_FAILURE, OVERRIDE_FAILURE, PRIOR_FAILURE,
# CATCHUP_FAILURE, MODEL_FAILURE, WRITE_FAILURE, PUBLISH_FAILURE, WEEKLY_FAILURE). A failed run never rebuilds the
# site. WEEKLY_WARNING (a season missing from ingest/seasons.json in September or October) does not fail the
# run; it is repeated as a job annotation and in the summary.

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season, the year it ends (2026-27 is 2027); blank = today'
        required: false
        type: string
      week:
        description: 'Week number; blank = the week that ended yesterday'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Shared with the other D1-writing workflows; an in-flight run finishes rather than being cancelled halfway.
  # Only one run can wait in the group (a newer waiting run replaces an older one): see the header comment.
  group: weekly-rankings
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run weekly update
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          # Inputs reach the shell as environment variables, never interpolated into the script.
          SEASON: ${{ inputs.season }}
          WEEK: ${{ inputs.week }}
        run: |
          set -o pipefail
          args=()
          [ -n "$SEASON" ] && args+=(--season "$SEASON")
          [ -n "$WEEK" ] && args+=(--week "$WEEK")
          # The script's exit code fails the job; tee keeps the output for the later steps.
          uv run --frozen python main.py "${args[@]}" 2>&1 | tee output.log
      - name: Detect a publish
        id: published
        run: |
          # WEEKLY_OK is printed only after the artifacts were uploaded (production runs always
          # publish); a no-op Monday prints WEEKLY_NOOP instead.
          if grep -q '^WEEKLY_OK ' output.log; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
            echo 'Nothing was published; the site is not rebuilt.'
          fi
      - name: Trigger personal-site rebuild
        id: hook
        if: steps.published.outputs.published == 'true'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.PERSONAL_SITE_DEPLOY_HOOK_URL }}
        run: |
          # The URL is a secret: never echo it (no shell tracing, curl output is discarded).
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo '::error::PERSONAL_SITE_DEPLOY_HOOK_URL is not set. The ratings and artifacts ARE published; only the site rebuild did not run.'
            exit 1
          fi
          if ! curl --fail --silent --show-error --output /dev/null -X POST "$DEPLOY_HOOK_URL"; then
            echo '::error::The deploy hook failed. The ratings and artifacts ARE published; only the site rebuild did not run. Re-run the hook or this workflow (a rerun is idempotent).'
            exit 1
          fi
          echo 'Deploy hook triggered.'
      - name: Summary
        if: always()
        env:
          PUBLISHED: ${{ steps.published.outputs.published }}
          HOOK_OUTCOME: ${{ steps.hook.outcome }}
        run: |
          {
            echo '### Weekly rankings'
            echo '```'
            grep -hE '^(WEEKLY_OK|WEEKLY_NOOP|WEEKLY_WARNING|WEEKLY_FAILURE|INGEST_FAILURE|OVERRIDE_FAILURE|CATCHUP_FAILURE|PRIOR_FAILURE|MODEL_FAILURE|WRITE_FAILURE|PUBLISH_FAILURE)' output.log 2>/dev/null || echo 'no marker line (see the job log)'
            echo "published=${PUBLISHED:-unknown} deploy_hook=${HOOK_OUTCOME:-skipped}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^WEEKLY_WARNING' output.log 2>/dev/null; then
            grep -h '^WEEKLY_WARNING' output.log | sed 's/^/::warning::/'
          fi
