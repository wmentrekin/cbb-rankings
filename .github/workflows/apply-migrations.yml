name: Apply D1 Migrations

# Manual only. Applies any new files in database/migrations/ to the remote D1 database through
# wrangler, which records them in the d1_migrations table. Applied migrations are never re-run.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-migrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # No --force: wrangler skips its confirmation prompt when it is not run interactively, as on
        # this runner (verified earlier), so the flag is unnecessary.
        run: npx wrangler@4 d1 migrations apply cbb-rankings --remote
