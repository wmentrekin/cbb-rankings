name: Test Week Run

# Manual rehearsal of one week with `main.py --staging`: ratings go to `ratings_staging`, nothing
# is published and the site is not rebuilt, unless `publish_staging` is ticked, which publishes
# under the cbb-staging/ prefix (never cbb/).
#
# What staging does NOT protect: the ingest still writes `games` and `teams` for real (idempotent
# upserts of source data; the overrides are re-applied right after) and spends 4 API calls.

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season, the year it ends (2026-27 is 2027)'
        required: true
        type: string
      week:
        description: 'Week number'
        required: true
        type: string
      publish_staging:
        description: 'Also publish under cbb-staging/ (unchecked = publish nothing)'
        type: boolean
        default: false
      allow_missing_prior:
        description: 'Rate weeks 1-9 even if the prior season is not stored'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-rankings
  cancel-in-progress: false

jobs:
  test_run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reminder - shared concurrency group
        run: |
          echo "::notice title=Shared concurrency group::Do not dispatch this workflow while the Monday 'Weekly Rankings' run is queued or about to start (Mondays 10:00 UTC). All D1-writing workflows share the group weekly-rankings: one run executes and only ONE waits, and a newer waiting run replaces an older waiting one, so this dispatch can silently cancel a queued Monday run. Check the Actions tab first."
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run staging week
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SEASON: ${{ inputs.season }}
          WEEK: ${{ inputs.week }}
          PUBLISH_STAGING: ${{ inputs.publish_staging }}
          ALLOW_MISSING_PRIOR: ${{ inputs.allow_missing_prior }}
        run: |
          set -o pipefail
          args=(--staging --season "$SEASON" --week "$WEEK")
          [ "$PUBLISH_STAGING" = "true" ] && args+=(--publish-staging)
          [ "$ALLOW_MISSING_PRIOR" = "true" ] && args+=(--allow-missing-prior)
          uv run --frozen python main.py "${args[@]}" 2>&1 | tee output.log
      - name: Summary
        if: always()
        run: |
          {
            echo '### Test week run (staging)'
            echo '```'
            grep -hE '^(WEEKLY_OK|WEEKLY_NOOP|WEEKLY_FAILURE|INGEST_FAILURE|OVERRIDE_FAILURE|CATCHUP_FAILURE|PRIOR_FAILURE|MODEL_FAILURE|WRITE_FAILURE|PUBLISH_FAILURE)' output.log 2>/dev/null || echo 'no marker line (see the job log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
